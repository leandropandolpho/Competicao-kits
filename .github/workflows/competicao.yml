# Testes objetivos da competição de kits — RASCUNHO NÃO CONGELADO v0.1
# Roda em Windows real. Primeiro valida o próprio harness (nulo = 0/40, oráculo = 40/40);
# só depois roda os kits anonimizados em kits/kit-A ... kits/kit-D. Logs e resultados ficam públicos.
name: competicao-kits
on:
  workflow_dispatch:

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Registrar hashes do harness
        run: |
          Get-ChildItem testes -Recurse -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash, (Resolve-Path -Relative $_.Path) }

      - name: Validar o harness (nulo deve dar 0/40, oráculo deve dar 40/40)
        run: |
          git config --global init.defaultBranch main
          foreach ($v in 'nulo','oraculo') {
            $k = "val/$v"; New-Item -ItemType Directory -Force $k | Out-Null
            Copy-Item "testes/validacao/controlador-$v.ps1" "$k/controlador.ps1"
            pwsh -NoProfile -File testes/run-cenarios.ps1 -KitDir $k -SaidaDir "saida/validacao-$v"
          }
          $n = (Get-Content saida/validacao-nulo/resultados.json -Raw | ConvertFrom-Json).pontos_objetivos
          $o = (Get-Content saida/validacao-oraculo/resultados.json -Raw | ConvertFrom-Json).pontos_objetivos
          "nulo=$n oraculo=$o"
          if ($n -ne 0 -or $o -ne 40) { throw "Harness inválido no Windows: nulo=$n oraculo=$o" }

      - name: Rodar os kits
        run: |
          if (-not (Test-Path kits)) { 'Nenhum kit ainda (pasta kits/ ausente).'; return }
          Get-ChildItem kits -Directory | ForEach-Object {
            pwsh -NoProfile -File testes/run-cenarios.ps1 -KitDir $_.FullName -SaidaDir "saida/$($_.Name)"
          }

      - name: Publicar resultados brutos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-objetivos
          path: saida/
