# Testes objetivos da competição de kits — RASCUNHO NÃO CONGELADO v0.2
# 1) Valida o próprio script de teste no Windows (nulo, oráculo, trapaceiro e mutantes).
# 2) Só se a validação passar, roda cada kit anonimizado (kits/kit-A ... kits/kit-D) num job separado.
# Os kits devem estar commitados em kits/<kit-X>/ antes de disparar o workflow.
name: competicao-kits
on:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  validar-harness:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Registrar hashes dos arquivos do pacote
        run: |
          Get-ChildItem -Recurse -File -Exclude *.md | Where-Object FullName -notmatch '\\.git\\' |
            Get-FileHash -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash, (Resolve-Path -Relative $_.Path) }
      - name: Validar o script de teste
        run: |
          git config --global init.defaultBranch main
          pwsh -NoProfile -File testes/validacao/validar-harness.ps1 -SaidaDir saida/validacao
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validacao-harness
          path: saida/validacao/resultados/

  kits:
    needs: validar-harness
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kit: [kit-A, kit-B, kit-C, kit-D]
    steps:
      - uses: actions/checkout@v7
      - name: Rodar os 8 cenários
        run: |
          git config --global init.defaultBranch main
          if (-not (Test-Path "kits/${{ matrix.kit }}/controlador.ps1")) { "kits/${{ matrix.kit }} ausente: nada a testar."; exit 0 }
          pwsh -NoProfile -File testes/run-cenarios.ps1 -KitDir "kits/${{ matrix.kit }}" -SaidaDir "saida/${{ matrix.kit }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resultados-${{ matrix.kit }}
          path: saida/
          if-no-files-found: ignore
